<template>
    <div class="section-header">🛒 Purchase History</div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Brand</th>
                <th>Channel</th>
                <th>Items</th>
                <th>Amount</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody>
            <template for:each={rows} for:item="row">
                <tr key={row.key}>
                    <td>{row.date}</td>
                    <td><strong>{row.brand}</strong></td>
                    <td><span class={row.channelClass}>{row.channelLabel}</span></td>
                    <td>{row.items}</td>
                    <td>{row.amount}</td>
                    <td class="points">{row.points}</td>
                </tr>
            </template>
        </tbody>
    </table>
</template>
