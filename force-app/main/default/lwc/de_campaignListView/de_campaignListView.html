<template>
    <div class="cc-clv">
        <!-- Header -->
        <div class="cc-clv__header">
            <div class="cc-clv__header-left">
                <p class="cc-clv__eyebrow">Campaigns</p>
                <div class="cc-clv__title-row">
                    <h1 class="cc-clv__title">{heading}</h1>
                    <lightning-icon icon-name="utility:down" size="x-small" alternative-text="Toggle"></lightning-icon>
                </div>
            </div>
            <div class="cc-clv__header-right">
                <div class="cc-clv__search">
                    <lightning-icon icon-name="utility:search" size="x-small" class="cc-clv__search-icon"></lightning-icon>
                    <input
                        type="search"
                        class="cc-clv__search-input"
                        placeholder="Search this list..."
                        value={searchTerm}
                        oninput={handleSearchChange}
                    />
                </div>
            </div>
        </div>

        <p class="cc-clv__meta">{metaLine}</p>

        <!-- Table card -->
        <div class="cc-card">
            <table class="cc-clv__table">
                <thead>
                    <tr>
                        <th scope="col">Campaign Name</th>
                        <th scope="col">Type</th>
                        <th scope="col">Start Date</th>
                        <th scope="col">End Date</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredRows} for:item="row">
                        <tr key={row.Id}>
                            <td>
                                <a
                                    href="#"
                                    class="cc-clv__link"
                                    data-id={row.Id}
                                    onclick={handleRowSelect}
                                >{row.Name}</a>
                            </td>
                            <td>{row.Type}</td>
                            <td>{row.StartDate}</td>
                            <td>{row.EndDate}</td>
                            <td>{row.Status}</td>
                        </tr>
                    </template>
                    <template if:true={hasNoResults}>
                        <tr>
                            <td colspan="5" class="cc-clv__empty">No campaigns match your search.</td>
                        </tr>
                    </template>
                    <template if:true={hasError}>
                        <tr>
                            <td colspan="5" class="cc-clv__empty cc-clv__empty_error">{campaignError}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>
