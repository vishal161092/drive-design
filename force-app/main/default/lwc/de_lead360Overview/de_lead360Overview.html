<template>
    <div class="overview-grid">
        <div class="overview-card">
            <h4>🔗 Unified Identity</h4>
            <div class="identity-graph">
                <template for:each={idNodes} for:item="node">
                    <div class={node.cls} key={node.key}>
                        <div class="node-label">{node.label}</div>
                        <div class="node-value">{node.value}</div>
                    </div>
                </template>
            </div>
        </div>

        <div class="overview-card">
            <h4>📊 Data Sources (5 connected)</h4>
            <ul class="data-source-list">
                <template for:each={dataSources} for:item="src">
                    <li key={src.key}><span class="dot"></span>{src.text}</li>
                </template>
            </ul>
        </div>

        <div class="overview-card full-width">
            <h4>📈 Key Metrics Summary</h4>
            <div class="metric-grid">
                <template for:each={metrics} for:item="m">
                    <div class="metric-cell" key={m.key}>
                        <div class={m.valueClass}>{m.value}</div>
                        <div class="metric-label">{m.label}</div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
